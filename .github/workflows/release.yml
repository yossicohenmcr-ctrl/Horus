name: Release

# Cut a signed, provenance-attested release from a version tag (audit finding
# 3.3 — build provenance / supply-chain half of boot integrity).
#
# `actions/attest-build-provenance` generates a SLSA-style build-provenance
# statement for each artifact, signed KEYLESS via Sigstore using this workflow's
# short-lived OIDC identity (no long-lived signing key to steal), and records it
# in the repository's attestation store. The attestation cryptographically binds
# each artifact's SHA-256 digest to THIS workflow run at THIS commit, so a
# relying party can confirm a downloaded kernel.elf / boot.iso was built by this
# repository's CI from the tagged, reviewed source — not substituted, and not
# built somewhere else. Verify a downloaded artifact with:
#
#     gh attestation verify kernel.elf --repo yossicohenmcr-ctrl/Horus
#
# Combined with the byte-for-byte reproducible build (the `reproducible` CI job),
# this closes the "bind running image to reviewed source" gap: anyone can
# rebuild the identical kernel.elf from the tagged commit AND confirm the
# published binary carries provenance from this repo's pipeline.
#
# The runtime half — verified boot (the machine refusing to run an unverified
# image at load) — is implemented: the kernel verifies its own loaded image
# (.text + .rodata) against an Ed25519 signature anchored to an embedded key and
# halts on a mismatch (src/kernel/verified_boot.c; accept + tamper-reject proven
# by the smoke-vboot job). When the offline key is configured, this workflow
# builds that ENFORCING image, signs it over its own bytes, and publishes it as
# kernel.vboot.elf / boot.vboot.iso; it also optionally emits a detached Ed25519
# signature over the release manifest. See docs/BOOT_INTEGRITY.md.
#
# KEY CUSTODY (important): the strict model signs with an OFFLINE key held in a
# hardware token, never on a CI runner. The enforcing-image and manifest-signing
# steps below are therefore OPTIONAL and only run when a maintainer sets the
# VBOOT_ED25519_PRIVATE_KEY secret; a CI-held key is a lower-assurance
# convenience channel, not the hardware-rooted anchor. Without the secret the
# release is still reproducible and provenance-attested (keyless Sigstore), just
# without the self-verifying image.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

# Least-privilege default; the release job elevates only what it needs.
permissions:
  contents: read

jobs:
  release:
    name: Build, attest provenance, and publish a signed release
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the GitHub Release + upload assets
      id-token: write       # OIDC identity for keyless Sigstore signing
      attestations: write   # write the build-provenance attestation
    # The `secrets` context is NOT permitted inside `if:` expressions — a workflow
    # that references it there fails at STARTUP (0 jobs, no logs) on every trigger,
    # which would silently produce no release on a version tag. Bind the optional
    # offline signing key to a job-level env var here (secrets ARE allowed in
    # `env`), and gate the optional enforcing-image / manifest-signing steps on
    # `env.VBOOT_ED25519_PRIVATE_KEY` instead.
    env:
      VBOOT_ED25519_PRIVATE_KEY: ${{ secrets.VBOOT_ED25519_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools

      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none

      # Deterministic kernel.elf (clean + build under the pinned SOURCE_DATE_EPOCH),
      # so the released binary matches what `make reproducible-build` yields for
      # anyone rebuilding the tagged commit.
      - name: Reproducible build of kernel.elf
        run: make reproducible-build

      - name: Build bootable ISO
        run: make boot.iso

      # OPTIONAL real verified-boot image. When the offline signing key is
      # configured, additionally build the ENFORCING kernel — which verifies its
      # own image bytes against the embedded anchor at boot and halts on a
      # mismatch — sign it over its own image, and publish it as kernel.vboot.elf
      # / boot.vboot.iso alongside the default artifacts. The default kernel.elf /
      # boot.iso (reproducible + provenance-attested) are preserved unchanged. The
      # key never leaves the ephemeral runner and is never committed. This is the
      # same mechanism the `smoke-vboot-image` CI job proves accept+reject on.
      - name: Build + sign the enforcing verified-boot image (optional)
        if: ${{ env.VBOOT_ED25519_PRIVATE_KEY != '' }}
        env:
          VBOOT_KEY: ${{ secrets.VBOOT_ED25519_PRIVATE_KEY }}
        run: |
          umask 077
          # Preserve the default (reproducible, attested) artifacts.
          cp kernel.elf kernel.default.elf
          cp boot.iso boot.default.iso
          mkdir -p build
          printf '%s' "$VBOOT_KEY" > build/vboot_priv.pem
          # Compile in the public half of the offline key as the trust anchor,
          # then build the enforcing kernel and sign it over its own image bytes.
          bash tools/vboot_anchor_header.sh build/vboot_priv.pem build/vboot_anchor.h
          make clean
          make VBOOT_ENFORCE=1 kernel.elf
          bash tools/vboot_sign.sh kernel.elf build/vboot_priv.pem
          cp kernel.elf kernel.vboot.elf
          make VBOOT_ENFORCE=1 boot.iso
          cp boot.iso boot.vboot.iso
          rm -f build/vboot_priv.pem
          # Restore the default artifacts for the manifest / attestation below.
          mv kernel.default.elf kernel.elf
          mv boot.default.iso boot.iso
          echo "Built + signed enforcing verified-boot image (kernel.vboot.elf / boot.vboot.iso)."

      - name: Compute SHA-256 manifest + build info
        run: |
          sha256sum kernel.elf boot.iso $(ls kernel.vboot.elf boot.vboot.iso 2>/dev/null) | tee SHA256SUMS
          {
            echo "repository: ${GITHUB_REPOSITORY}"
            echo "ref:        ${GITHUB_REF_NAME}"
            echo "commit:     ${GITHUB_SHA}"
            echo "run:        ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } | tee BUILDINFO.txt

      # OPTIONAL detached Ed25519 signature over the manifest (which binds every
      # artifact's SHA-256 digest). Runs only when VBOOT_ED25519_PRIVATE_KEY is
      # configured; the strict model uses an OFFLINE/hardware-token key, so this
      # CI-side path is a lower-assurance convenience. The signature is verifiable
      # by the kernel's own Ed25519 verifier (rust/src/ed25519.rs) and by the
      # published public key. The private key is never written to disk beyond the
      # ephemeral runner and never committed.
      - name: Sign the release manifest (optional, Ed25519)
        if: ${{ env.VBOOT_ED25519_PRIVATE_KEY != '' }}
        env:
          VBOOT_KEY: ${{ secrets.VBOOT_ED25519_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s' "$VBOOT_KEY" > signing_key.pem
          # Detached raw Ed25519 signature (64 bytes: R||S) over the manifest.
          openssl pkeyutl -sign -inkey signing_key.pem \
            -rawin -in SHA256SUMS -out SHA256SUMS.sig
          # Publish the public half so relying parties can verify the signature.
          openssl pkey -in signing_key.pem -pubout -out vboot_pubkey.pem
          rm -f signing_key.pem
          echo "Signed SHA256SUMS -> SHA256SUMS.sig (verify with vboot_pubkey.pem)"

      # Best-effort SBOM (CycloneDX). Pinned + checksum-verified Trivy, matching
      # the CI security job; never blocks the release.
      - name: Generate SBOM (CycloneDX via Trivy)
        continue-on-error: true
        run: |
          TRIVY_VERSION=0.72.0
          curl -sfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o trivy.tar.gz
          echo "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea  trivy.tar.gz" | sha256sum --check
          tar -xzf trivy.tar.gz trivy
          ./trivy fs --format cyclonedx --output sbom.cyclonedx.json --scanners vuln,secret,misconfig . || true

      # Provenance for the release artifacts (blocking: a release must be attestable).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            kernel.elf
            boot.iso
            SHA256SUMS

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS="kernel.elf boot.iso SHA256SUMS BUILDINFO.txt"
          [ -f sbom.cyclonedx.json ] && ASSETS="$ASSETS sbom.cyclonedx.json"
          [ -f SHA256SUMS.sig ] && ASSETS="$ASSETS SHA256SUMS.sig vboot_pubkey.pem"
          [ -f kernel.vboot.elf ] && ASSETS="$ASSETS kernel.vboot.elf boot.vboot.iso"
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Horus ${GITHUB_REF_NAME}" \
            --notes "Signed, provenance-attested build of Horus ${GITHUB_REF_NAME}.

          **Verify provenance** (binds each artifact to this repo's CI at commit \`${GITHUB_SHA}\`):
          \`\`\`
          gh attestation verify kernel.elf --repo ${GITHUB_REPOSITORY}
          gh attestation verify boot.iso   --repo ${GITHUB_REPOSITORY}
          \`\`\`
          **Verify integrity** against the manifest:
          \`\`\`
          sha256sum -c SHA256SUMS
          \`\`\`
          \`kernel.elf\` is byte-for-byte reproducible from the tagged source (see docs/BUILDING.md).
          When present, \`kernel.vboot.elf\` / \`boot.vboot.iso\` are the ENFORCING verified-boot image: the
          kernel verifies its own \`.text\`+\`.rodata\` against an embedded Ed25519 anchor at boot and halts on a
          mismatch (accept + tamper-reject are both proven by the \`smoke-vboot\` CI job). A detached
          \`SHA256SUMS.sig\` + \`vboot_pubkey.pem\`, when attached, additionally sign the manifest. See
          docs/BOOT_INTEGRITY.md." \
            $ASSETS
