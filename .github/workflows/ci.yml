name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Newer pushes to the same ref cancel older in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN permissions (defense-in-depth for CI)
permissions:
  contents: read
  actions: read
  pull-requests: read
  # No write permissions by default. upload-artifact is specially granted by GitHub for this workflow.

env:
  CARGO_TERM_COLOR: always

# Hermetic build inputs are pinned so the `reproducible` job holds across time,
# not just within a single run: the Rust toolchain (version, clippy, bare-metal
# target) is pinned by rust-toolchain.toml, and the runner image is pinned to
# ubuntu-24.04 rather than the floating ubuntu-latest so the C toolchain
# (gcc/binutils/grub/xorriso) does not drift under the build. See docs/BUILDING.md.
jobs:
  rust:
    name: Rust unit tests + clippy (deny-warnings gate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - name: Install clippy component
        run: rustup component add clippy
      # --locked: fail if Cargo.lock is out of date w.r.t. Cargo.toml, so a
      # dependency added to the manifest but not committed to the lock cannot
      # slip through by silently rewriting the lock during the build.
      - name: Unit tests (release)
        run: cargo test --manifest-path rust/Cargo.toml --release --locked
      - name: Clippy — all targets, deny every warning
        run: cargo clippy --manifest-path rust/Cargo.toml --release --all-targets --locked -- -D warnings
      - name: Zero-dependency guard (Cargo.lock has no third-party crates)
        run: tools/check_zero_deps.sh
      - name: Doc-count guard (test/CI-job counts match the docs)
        run: tools/check_doc_counts.sh

  kernel:
    name: Build kernel.elf + bootable ISO (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Build kernel.elf
        run: make
      - name: Build bootable ISO
        run: make boot.iso
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: horus-kernel-x86_64
          path: |
            kernel.elf
            boot.iso
          if-no-files-found: error

  # Keep the non-default build configurations compiling. The default config is
  # covered by the `kernel` job above; these flags (DEBUG_SHELL, MINIMAL_SECURE)
  # toggle whole regions of the kernel via #ifdef and have broken silently
  # before when only the default build was checked. A bare `make` (no ISO) is
  # enough to catch that; -Werror=vla in CFLAGS also gates here.
  altconfigs:
    name: Build alternate configs (${{ matrix.config }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config:
          - DEBUG_SHELL=1
          - MINIMAL_SECURE=1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Build kernel.elf (${{ matrix.config }})
        run: make ${{ matrix.config }}

  smoke:
    name: QEMU smoke-boot (headless)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Boot the kernel under QEMU and assert it reaches the shell
        run: make smoke

  smoke-elf:
    name: QEMU ELF-loader W^X self-test (headless)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Boot ELF_SELFTEST kernel and assert try_elf_load enforces W^X
        run: make smoke-elf

  smoke-preempt:
    name: QEMU preemptive-scheduling self-test (headless)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Boot PREEMPT_SELFTEST kernel and assert the timer time-slices two ring-3 tasks
        run: make smoke-preempt

  smoke-signal:
    name: QEMU signal-handling self-test (headless)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Boot SIGNAL_SELFTEST kernel and assert a ring-3 fault is delivered to its handler
        run: make smoke-signal

  smoke-smp:
    name: QEMU SMP self-test (headless, -smp 4)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Boot SMP_SELFTEST kernel under -smp 4 and assert APs run scheduled tasks + TLB shootdown
        run: make smoke-smp

  smoke-proc:
    name: QEMU process-control self-test (headless)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Boot PROC_SELFTEST kernel and assert SYS_EXIT + capability-gated SYS_KILL work
        run: make smoke-proc

  smoke-notify:
    name: QEMU async-notification self-test (headless)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Boot NOTIFY_SELFTEST kernel and assert SYS_NOTIFY delivers a badge to a blocked SYS_WAIT_NOTIFY
        run: make smoke-notify

  smoke-vboot:
    name: QEMU Ed25519 verified-boot (manifest self-test + real signed image, headless)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - name: Install build toolchain + QEMU + openssl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86 openssl
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Boot VBOOT_SELFTEST kernel and assert the Ed25519 gate authorizes a valid manifest and halts on a tampered one
        run: make smoke-vboot
      - name: Sign the REAL kernel image and assert it boots signed but halts when tampered
        run: make smoke-vboot-image

  smoke-session:
    name: Scripted integration session (headless, drives the real shell)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Drive the ring-3 shell over serial and assert auth + least-privilege enforcement
        run: make smoke-session

  smoke-fs:
    name: QEMU filesystem self-test (headless)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Boot FS_SELFTEST kernel and assert the ring-3 fs_server serves a client end-to-end
        run: make smoke-fs

  smoke-fs-perms:
    name: QEMU filesystem permissions self-test (headless)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Boot PERM_SELFTEST kernel and assert POSIX owner/group/other rwx is enforced against the kernel-attested uid
        run: make smoke-fs-perms

  smoke-fs-conc:
    name: QEMU filesystem multi-client concurrency self-test (headless)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Boot CONC_SELFTEST kernel and assert concurrent clients each receive only their own replies
        run: make smoke-fs-conc

  smoke-fs-persist:
    name: QEMU filesystem persistence self-test (two-boot, headless)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Boot twice against one ATA image and assert an encrypted file survives a reboot
        run: make smoke-fs-persist

  smoke-fs-wal:
    name: QEMU filesystem journal crash-recovery self-test (two-boot, headless)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Crash after commit on boot 1 and assert the write-ahead journal replays it on boot 2
        run: make smoke-fs-wal

  smoke-fs-large:
    name: QEMU large-file (double-indirect) self-test (headless)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Boot BIGFILE_SELFTEST kernel and assert an inode maps through the double-indirect region
        run: make smoke-fs-large

  smoke-newlib:
    name: QEMU newlib libc self-test (headless)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - name: Install build toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils make gcc-multilib \
            xorriso grub-pc-bin grub-common mtools \
            qemu-system-x86
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      # newlib/install is gitignored and built from pinned source by
      # scripts/build-newlib.sh. Cache it across runs (keyed on the build script)
      # so it is built once and restored thereafter.
      - name: Cache the newlib libc build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: newlib/install
          key: newlib-i686-elf-4.5.0.20241231-${{ hashFiles('scripts/build-newlib.sh') }}
      - name: Provision newlib (builds on cache miss, no-op on hit)
        run: make newlib
      - name: Boot NEWLIB_SELFTEST kernel and assert the newlib libc port over the POSIX fd layer works
        run: make smoke-newlib

  reproducible:
    name: Verify reproducible kernel build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils make
      - name: Add bare-metal Rust target
        run: rustup target add x86_64-unknown-none
      - name: Build twice and compare kernel.elf hashes
        run: |
          make reproducible-build
          sha256sum kernel.elf | tee first.sha
          make reproducible-build
          sha256sum kernel.elf | tee second.sha
          if ! diff -u first.sha second.sha; then
            echo "::error::kernel.elf is not byte-for-byte reproducible"
            exit 1
          fi
          echo "kernel.elf is byte-for-byte reproducible across clean builds"

  # Advisory job: surfaces SAST/secret/dependency findings and an SBOM for
  # review, but does NOT gate merges. `make security` is advisory by design
  # (four of its six scanners already swallow failures), and it scans the
  # workflow files and host tooling with rulesets (incl. semgrep --config=auto)
  # whose findings — e.g. mutable action tags, curl|sh installs — are CI
  # hygiene rather than kernel defects, and whose registry-fetched rules can
  # change with no code change. The hard gates are the other four jobs (rust,
  # kernel, smoke, reproducible). Steps use continue-on-error so a finding or a
  # flaky tool download reports without reddening the pipeline, and the SBOM
  # step still runs.
  security:
    name: Security scans + SBOM (gitleaks + Semgrep ERROR block; rest advisory)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          fetch-depth: 0   # needed for gitleaks full history scan

      - name: Install security tools + Rust target (pinned where practical)
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck flawfinder
          pipx install semgrep || pip install semgrep
          # Trivy — pinned release + checksum verification (avoids curl|sh)
          TRIVY_VERSION=0.72.0
          curl -sfL https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz -o trivy.tar.gz
          echo "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea  trivy.tar.gz" | sha256sum --check
          tar -xzf trivy.tar.gz trivy && sudo mv trivy /usr/local/bin/ && rm trivy.tar.gz
          # gitleaks pinned
          go install github.com/gitleaks/gitleaks@v8.21.0 || true
          # Rust bare-metal target for cargo-audit and Makefile
          rustup target add x86_64-unknown-none
          cargo install cargo-audit || true

      # BLOCKING gate: committed secrets (gitleaks, full history) and Semgrep
      # ERROR-severity findings fail the build. Both are verified clean on main;
      # reviewed false positives live in .gitleaks.toml.
      - name: Security gate — gitleaks + Semgrep (ERROR) [blocking]
        run: make security-blocking

      # Advisory scanners: surfaced for review, never fail the build.
      - name: Security scans — Trivy, cppcheck, flawfinder, cargo-audit [advisory]
        continue-on-error: true
        run: make security-advisory

      - name: Generate SBOM (CycloneDX via Trivy)
        continue-on-error: true
        run: |
          trivy fs --format cyclonedx --output sbom.cyclonedx.json \
            --scanners vuln,secret,misconfig .
          echo "SBOM generated: sbom.cyclonedx.json"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: horus-sbom-cyclonedx
          path: sbom.cyclonedx.json
          if-no-files-found: warn

  tla:
    # NOTE: this job's `name` is a REQUIRED branch-protection status-check context
    # (matched verbatim). Do not rename it or the required check will hang forever
    # as "Expected — Waiting for status to be reported". New specs go in the step
    # below, not in this name. (The seqlock spec was added this way.)
    name: TLA+ model checking (cap algebra + paging isolation)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      # A JRE from the distro repos (same apt discipline as cppcheck/flawfinder);
      # tla2tools.jar is fetched and SHA-256-verified by the Makefile target.
      - name: Install JRE
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre-headless

      # BLOCKING gate: TLC exhaustively checks each spec's safety invariants and
      # exits non-zero (12) on any violation. The specs are real and falsifiable
      # (subset-rights non-escalation; per-task frame isolation; the two-CPU
      # seqlock's no-torn-read; the IPC lookup/use no-use-after-revoke; and the
      # SMP run-pool no-double-run properties), not decorative.
      - name: Model-check TLA+ specs (cap algebra, paging, seqlock, IPC TOCTOU, SMP sched)
        run: make verify-tla
