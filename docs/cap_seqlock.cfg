\* TLC model for cap_seqlock. Two CPUs contend over the seqlock: either may
\* take cap_lock and perform a two-store (non-atomic) write while the other
\* runs the lock-free cap_lookup reader, so every interleaving of a writer's
\* torn window against a reader's field reads is exhaustively explored. Two
\* completed writes are enough to exercise old-vs-new version tearing.
SPECIFICATION Spec

CONSTANTS
    CPUs      = {1, 2}
    MaxWrites = 2

INVARIANT Inv
