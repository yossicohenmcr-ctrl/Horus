\* TLC model for ipc_toctou. Two concurrent IPC senders race an adversary that
\* revokes and re-mints the authorizing capability slot, so every interleaving
\* of snapshot / revoke / re-mint / revalidate-commit is explored. With the
\* revalidate guard ON (matching the kernel), no committed effect ever uses
\* revoked authority. Flip USE_REVALIDATE_GUARD to FALSE to falsify.
SPECIFICATION Spec

CONSTANTS
    Senders              = {1, 2}
    MaxSerial            = 3
    USE_REVALIDATE_GUARD = TRUE

INVARIANT Inv

\* Once every sender reaches "done" with no revoke/re-mint budget left, there is
\* a legitimate terminal state; we check safety over all reachable states.
CHECK_DEADLOCK FALSE
