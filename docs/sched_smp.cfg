\* TLC model for sched_smp. Two CPUs pull from a shared pool of two runnable
\* tasks under sched_raw_lock, so every interleaving of observe / claim / yield
\* across both CPUs is explored. With the lock ON (matching the kernel) no task
\* ever runs on two CPUs. Flip USE_LOCK to FALSE to falsify (double-run).
SPECIFICATION Spec

CONSTANTS
    CPUs     = {1, 2}
    Tasks    = {1, 2}
    USE_LOCK = TRUE

INVARIANT Inv

CHECK_DEADLOCK FALSE
