\* TLC model for cap_algebra. Small finite bounds keep the state space
\* exhaustively checkable in a few seconds while still exercising mint /
\* transfer / revoke across two tasks and two objects with distinct ceilings.
SPECIFICATION Spec

CONSTANTS
    Tasks    = {1, 2}
    Slots    = {1, 2, 3}
    Objects  = {1, 2}
    Rights   = {"READ", "WRITE", "GRANT"}
    MaxGen   = 3

\* Object 1's primordial holds all three rights; object 2 only READ+WRITE.
\* If any derivation of object 2 ever gained GRANT, NoEscalation would fail.
\* (Constant-operator override: a computed function literal is not allowed
\* directly in a .cfg CONSTANTS assignment.)
CONSTANT Ceiling <- CeilingImpl

INVARIANT Inv

\* Revoking every object up to MaxGen clears all capabilities, leaving a
\* legitimate terminal state with no enabled action. We are checking safety
\* invariants over all reachable states, not liveness, so a terminal state is
\* expected rather than a bug.
CHECK_DEADLOCK FALSE
