\* TLC model for paging_isolation. Two tasks contend for a small shared pool
\* of user frames (fewer frames than total pages, so allocation and reuse are
\* exercised) alongside a disjoint kernel-frame pool the model must never map.
SPECIFICATION Spec

CONSTANTS
    Tasks        = {1, 2}
    UserPages    = {0, 1}
    UserFrames   = {1, 2, 3}
    KernelFrames = {90, 91}

INVARIANT Inv
